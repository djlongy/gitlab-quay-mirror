workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, sync]

# Use a runner with Python 3.11+, skopeo, and a persistent MIRROR_WORK/MIRROR_OUTBOX mount.
# The outbox is the NiFi or SMB pickup point; image bundles can exceed GitLab's artifact limit.
default:
  tags: [quay-mirror]

check:
  stage: check
  script:
    - python3 mirror.py targets
    - python3 -m unittest discover -s tests

sync:
  stage: sync
  resource_group: quay-mirror
  script:
    - python3 mirror.py sync
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/
