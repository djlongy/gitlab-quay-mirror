---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, publish]
variables:
  PYTHON_IMAGE: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
  # Debug variants carry a busybox shell; the binaries are /syft and /grype.
  SYFT_IMAGE: 'docker.io/anchore/syft:v1.54.0-debug'
  GRYPE_IMAGE: 'docker.io/anchore/grype:v0.120.0-debug'
  GRYPE_FAIL_ON: 'critical'
  # false skips sbom and scan, and sync no longer waits for them.
  MIRROR_SCAN: 'true'
  # Runner tag for every job; empty sends them to any runner that takes untagged jobs.
  MIRROR_JOB_TAG: ''
  # Run pipeline with RESEND_ALL=true sends every approved image instead of only changes.
  RESEND_ALL: 'false'
  # Run pipeline with one of these set runs resend instead of sync: YYYY-MM-DD, N / N.. / N..M, repo[:tag].
  RESEND_SINCE: ''
  RESEND_SEQUENCE: ''
  RESEND_IMAGE: ''
  # How sync's bundles leave: none (sync TARGET_REGISTRY only, no bundles; carry images with
  # mirror.py export), export (sync TARGET_REGISTRY, then export what this run added as one tar into
  # MIRROR_SEND_PATH for NiFi to carry; load it on the high side), nifi (POST to NIFI_URL), dir (.ffv3 files in MIRROR_SEND_PATH, e.g. an NFS share
  # mounted on the runner, for a low NiFi ListFile) or s3 (.ffv3 objects in S3_BUCKET at S3_ENDPOINT,
  # S3_PREFIX optional, keys in AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, for a low NiFi ListS3).
  MIRROR_SEND: 'none'
  # true: delta bundles leave out layers the high side already has (README, Blob delta).
  MIRROR_BLOB_DELTA: 'false'
  MIRROR_SEND_PATH: ''
  # MIRROR_SEND=export: where the tar is built before it moves into MIRROR_SEND_PATH. Same filesystem.
  # Empty: MIRROR_SEND_PATH/.staging. Every job prints the directories it writes to.
  MIRROR_STAGING_PATH: ''

verify:
  stage: verify
  image: $PYTHON_IMAGE
  tags: [$MIRROR_JOB_TAG]
  dependencies: []
  script:
    - python3 mirror.py targets
    - python3 -m unittest discover -s tests -v
    # What sync would send next; sbom and scan check exactly these. The job token reads the ledger.
    - MIRROR_LEDGER=true python3 mirror.py pending $(case "$MIRROR_SEND" in none) echo --synced;; export) echo --carried;; esac) > pending.txt
    - cat pending.txt
  artifacts:
    paths: [pending.txt]
    expire_in: 1 week

.gate: &gate
  stage: verify
  tags: [$MIRROR_JOB_TAG]
  # A docker executor runs the job in the scanner's image; a shell executor has only podman, so
  # run_image starts the same image through it. Grype's database goes in the job directory.
  before_script:
    - |
      run_image() {
        image=$1; binary=$2; shift 2
        if [ -x "$binary" ]; then "$binary" "$@"
        else podman run --rm --user 0 -v "$PWD:$PWD:z" -w "$PWD" -e GRYPE_DB_CACHE_DIR="$PWD/.grype-db" \
          --entrypoint "$binary" "$image" "$@"; fi
      }
  after_script:
    - rm -rf .grype-db
  rules:
    - if: '$MIRROR_SCAN == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - images.txt
        - mirror.py
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

# One CycloneDX SBOM per pending image, for the platform the mirror carries. Charts hold no packages.
sbom:
  <<: *gate
  image:
    name: $SYFT_IMAGE
    entrypoint: ['']
  needs: [verify]
  script:
    - |
      mkdir -p sbom
      failed=0
      while read -r source; do
        name="${source%@*}"; digest="${source#*@}"; reference="${name%:*}@$digest"
        file="sbom/$(echo "$digest" | tr : -).cdx.json"
        echo "sbom: $source"
        if ! run_image "$SYFT_IMAGE" /syft scan "registry:$reference" --platform "${MIRROR_PLATFORM:-linux/amd64}" \
            -o "cyclonedx-json=$file" 2> syft.err; then
          rm -f "$file"
          if grep -q 'application/vnd.cncf.helm' syft.err; then
            echo "chart, no packages to list: $source"
          else
            cat syft.err; failed=1
          fi
        fi
      done < pending.txt
      exit "$failed"
  artifacts:
    paths: [sbom/]
    expire_in: 1 week

# A merge request needs this to pass (Pipelines must succeed), and sync waits for it.
scan:
  <<: *gate
  image:
    name: $GRYPE_IMAGE
    entrypoint: ['']
    docker:
      user: root  # the image runs as uid 65532, which cannot write the job's checkout
  needs: [sbom]
  script:
    - |
      failed=0
      for file in sbom/*.cdx.json; do
        [ -e "$file" ] || continue
        echo "grype: $file"
        run_image "$GRYPE_IMAGE" /grype "sbom:$file" --only-fixed --fail-on "$GRYPE_FAIL_ON" -o table \
          -o "json=${file%.cdx.json}.grype.json" || failed=1
      done
      exit "$failed"
  artifacts:
    when: always
    paths: [sbom/]
    expire_in: 1 week

# A runner with python3, skopeo and curl. sync writes bundles to outbox/, send delivers and deletes them.
# Merge-request validation runs elsewhere, without registry credentials.
sync: &mirror
  stage: publish
  environment:
    name: mirror-low
    action: prepare
  tags: [$MIRROR_JOB_TAG]
  resource_group: registry-mirror
  needs:
    - job: verify
      artifacts: false
    - job: scan
      artifacts: true
      optional: true  # absent with MIRROR_SCAN=false
  variables:
    # Sender state lives in this project's package registry, and the work directory in the job's own
    # checkout, removed afterwards: nothing persists on the runner.
    MIRROR_LEDGER: 'true'
    MIRROR_STATE_DIR: '$CI_PROJECT_DIR/.mirror-work'
    # A CI job has no XDG_RUNTIME_DIR, so skopeo's default auth file is not writable.
    REGISTRY_AUTH_FILE: $CI_PROJECT_DIR/.registry-auth.json
  script:
    - python3 mirror.py login
    - |
      if [ "$MIRROR_SEND" = "none" ]; then
        python3 mirror.py sync --low-only
      elif [ "$MIRROR_SEND" = "export" ]; then
        python3 mirror.py carry --path "${MIRROR_SEND_PATH:?MIRROR_SEND=export needs MIRROR_SEND_PATH}" \
          ${MIRROR_STAGING_PATH:+--staging "$MIRROR_STAGING_PATH"} $([ "$RESEND_ALL" = "true" ] && echo --all)
      elif [ "$RESEND_ALL" = "true" ]; then
        python3 mirror.py sync --all --out outbox
      else
        python3 mirror.py sync --out outbox
      fi
    - |
      if [ "$MIRROR_SEND" != "none" ] && [ "$MIRROR_SEND" != "export" ]; then
        python3 mirror.py send "$MIRROR_SEND" outbox ${MIRROR_SEND_PATH:+--path "$MIRROR_SEND_PATH"}
      fi
    # Keep each sent image's SBOM and scan report, by digest, for audit.
    - |
      for file in sbom/*.json; do
        [ -e "$file" ] || continue
        base=$(basename "$file"); version=${base%%.*}
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "${GITLAB_API_URL:-$CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/generic/registry-mirror-sbom/$version/$base"
        echo "kept: registry-mirror-sbom/$version/$base"
      done
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.registry-auth.json" "$CI_PROJECT_DIR/.mirror-work" "$CI_PROJECT_DIR/outbox"
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    # The pre-rename name still runs the job, so mirror.py fails and names TARGET_REGISTRY.
    - if: '$LOW_QUAY_HOST != null && $LOW_QUAY_HOST != ""'
    # A project without a target registry is the source repository, not a deployment: nothing to sync.
    - if: '$TARGET_REGISTRY == null'
      when: never
    - if: '$TARGET_REGISTRY == ""'
      when: never
    # One variable per rule: GitLab 18.9 evaluates `$A || $B` false when A is declared empty above.
    - if: '$RESEND_SINCE != null && $RESEND_SINCE != ""'
      when: never
    - if: '$RESEND_SEQUENCE != null && $RESEND_SEQUENCE != ""'
      when: never
    - if: '$RESEND_IMAGE != null && $RESEND_IMAGE != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - images.txt
        - mirror.py
        - .gitlab-ci.yml

# Run pipeline with RESEND_SINCE, RESEND_SEQUENCE or RESEND_IMAGE resends recorded images as the next bundle.
resend:
  <<: *mirror
  needs:
    - job: verify
      artifacts: false
  script:
    - python3 mirror.py login
    - python3 mirror.py resend --out outbox ${RESEND_SINCE:+--since "$RESEND_SINCE"} ${RESEND_SEQUENCE:+--sequence "$RESEND_SEQUENCE"} ${RESEND_IMAGE:+--image "$RESEND_IMAGE"}
    - python3 mirror.py send "$MIRROR_SEND" outbox ${MIRROR_SEND_PATH:+--path "$MIRROR_SEND_PATH"}
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    # The pre-rename name still runs the job, so mirror.py fails and names TARGET_REGISTRY.
    - if: '$LOW_QUAY_HOST != null && $LOW_QUAY_HOST != ""'
    # A project without a target registry is the source repository, not a deployment: nothing to sync.
    - if: '$TARGET_REGISTRY == null'
      when: never
    - if: '$TARGET_REGISTRY == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RESEND_SINCE != null && $RESEND_SINCE != ""'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RESEND_SEQUENCE != null && $RESEND_SEQUENCE != ""'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RESEND_IMAGE != null && $RESEND_IMAGE != ""'
