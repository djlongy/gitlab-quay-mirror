---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, publish]
variables:
  PYTHON_IMAGE: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
  # Debug variants carry a busybox shell; the binaries are /syft and /grype.
  SYFT_IMAGE: 'docker.io/anchore/syft:v1.54.0-debug'
  GRYPE_IMAGE: 'docker.io/anchore/grype:v0.120.0-debug'
  GRYPE_FAIL_ON: 'critical'
  # false skips sbom and scan, and sync no longer waits for them.
  MIRROR_SCAN: 'true'
  # Runner tag for verify, sbom and scan; empty sends them to any runner that takes untagged jobs.
  MIRROR_JOB_TAG: ''
  MIRROR_FULL: 'false'
  # Run pipeline with one of these set runs export instead of sync: YYYY-MM-DD, N / N.. / N..M, org/repo[:tag].
  EXPORT_SINCE: ''
  EXPORT_SEQUENCE: ''
  EXPORT_IMAGE: ''

verify:
  stage: verify
  image: $PYTHON_IMAGE
  tags: [$MIRROR_JOB_TAG]
  dependencies: []
  script:
    - python3 mirror.py targets
    - python3 -m unittest discover -s tests -v
    # What sync would send next; sbom and scan check exactly these. The job token reads the ledger.
    - MIRROR_LEDGER=true python3 mirror.py pending > pending.txt
    - cat pending.txt
  artifacts:
    paths: [pending.txt]
    expire_in: 1 week

.gate: &gate
  stage: verify
  tags: [$MIRROR_JOB_TAG]
  # A docker executor runs the job in the scanner's image; a shell executor has only podman, so
  # run_image starts the same image through it. Grype's database goes in the job directory.
  before_script:
    - |
      run_image() {
        image=$1; binary=$2; shift 2
        if [ -x "$binary" ]; then "$binary" "$@"
        else podman run --rm --user 0 -v "$PWD:$PWD:z" -w "$PWD" -e GRYPE_DB_CACHE_DIR="$PWD/.grype-db" \
          --entrypoint "$binary" "$image" "$@"; fi
      }
  after_script:
    - rm -rf .grype-db
  rules:
    - if: '$MIRROR_SCAN == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - images.txt
        - mirror.py
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

# One CycloneDX SBOM per pending image, for the platform the mirror carries. Charts hold no packages.
sbom:
  <<: *gate
  image:
    name: $SYFT_IMAGE
    entrypoint: ['']
  needs: [verify]
  script:
    - |
      mkdir -p sbom
      failed=0
      while read -r source; do
        name="${source%@*}"; digest="${source#*@}"; reference="${name%:*}@$digest"
        file="sbom/$(echo "$digest" | tr : -).cdx.json"
        echo "sbom: $source"
        if ! run_image "$SYFT_IMAGE" /syft scan "registry:$reference" --platform "${MIRROR_PLATFORM:-linux/amd64}" \
            -o "cyclonedx-json=$file" 2> syft.err; then
          rm -f "$file"
          if grep -q 'application/vnd.cncf.helm' syft.err; then
            echo "chart, no packages to list: $source"
          else
            cat syft.err; failed=1
          fi
        fi
      done < pending.txt
      exit "$failed"
  artifacts:
    paths: [sbom/]
    expire_in: 1 week

# A merge request needs this to pass (Pipelines must succeed), and sync waits for it.
scan:
  <<: *gate
  image:
    name: $GRYPE_IMAGE
    entrypoint: ['']
    docker:
      user: root  # the image runs as uid 65532, which cannot write the job's checkout
  needs: [sbom]
  script:
    - |
      failed=0
      for file in sbom/*.cdx.json; do
        [ -e "$file" ] || continue
        echo "grype: $file"
        run_image "$GRYPE_IMAGE" /grype "sbom:$file" --only-fixed --fail-on "$GRYPE_FAIL_ON" -o table \
          -o "json=${file%.cdx.json}.grype.json" || failed=1
      done
      exit "$failed"
  artifacts:
    when: always
    paths: [sbom/]
    expire_in: 1 week

# A protected shell runner with skopeo. Bundles go to NiFi and are deleted once it accepts them.
# Merge-request validation runs elsewhere, without registry credentials.
sync: &mirror
  stage: publish
  environment:
    name: mirror-low
    action: prepare
  tags: [quay-mirror]
  resource_group: quay-mirror
  needs:
    - job: verify
      artifacts: false
    - job: scan
      artifacts: true
      optional: true  # absent with MIRROR_SCAN=false
  variables:
    # Sender state lives in this project's package registry, and the work directory in the job's own
    # checkout, removed afterwards: nothing persists on the runner.
    MIRROR_LEDGER: 'true'
    MIRROR_STATE_DIR: '$CI_PROJECT_DIR/.mirror-work'
    # A CI job has no XDG_RUNTIME_DIR, so skopeo's default auth file is not writable.
    REGISTRY_AUTH_FILE: $CI_PROJECT_DIR/.registry-auth.json
  script:
    - printf '%s' "$LOW_QUAY_PASSWORD" | skopeo login --tls-verify="${LOW_QUAY_TLS_VERIFY:-true}" --username "$LOW_QUAY_USERNAME" --password-stdin "$LOW_QUAY_HOST"
    - |
      if [ -n "${UPSTREAM_USERNAME:-}" ]; then
        printf '%s' "$UPSTREAM_PASSWORD" | skopeo login --tls-verify="${UPSTREAM_TLS_VERIFY:-true}" --username "$UPSTREAM_USERNAME" --password-stdin "${UPSTREAM_REGISTRY:-docker.io}"
      fi
    - |
      if [ "$MIRROR_FULL" = "true" ]; then
        python3 mirror.py sync --full
      else
        python3 mirror.py sync
      fi
    # Keep each sent image's SBOM and scan report, by digest, for audit.
    - |
      for file in sbom/*.json; do
        [ -e "$file" ] || continue
        base=$(basename "$file"); version=${base%%.*}
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "${GITLAB_API_URL:-$CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/generic/quay-mirror-sbom/$version/$base"
        echo "kept: quay-mirror-sbom/$version/$base"
      done
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.registry-auth.json" "$CI_PROJECT_DIR/.mirror-work"
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    # One variable per rule: GitLab 18.9 evaluates `$A || $B` false when A is declared empty above.
    - if: '$EXPORT_SINCE != null && $EXPORT_SINCE != ""'
      when: never
    - if: '$EXPORT_SEQUENCE != null && $EXPORT_SEQUENCE != ""'
      when: never
    - if: '$EXPORT_IMAGE != null && $EXPORT_IMAGE != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - images.txt
        - mirror.py
        - .gitlab-ci.yml

# Run pipeline with EXPORT_SINCE, EXPORT_SEQUENCE or EXPORT_IMAGE resends recorded images as the next bundle.
export:
  <<: *mirror
  needs:
    - job: verify
      artifacts: false
  script:
    - printf '%s' "$LOW_QUAY_PASSWORD" | skopeo login --tls-verify="${LOW_QUAY_TLS_VERIFY:-true}" --username "$LOW_QUAY_USERNAME" --password-stdin "$LOW_QUAY_HOST"
    - |
      if [ -n "${UPSTREAM_USERNAME:-}" ]; then
        printf '%s' "$UPSTREAM_PASSWORD" | skopeo login --tls-verify="${UPSTREAM_TLS_VERIFY:-true}" --username "$UPSTREAM_USERNAME" --password-stdin "${UPSTREAM_REGISTRY:-docker.io}"
      fi
    - python3 mirror.py export ${EXPORT_SINCE:+--since "$EXPORT_SINCE"} ${EXPORT_SEQUENCE:+--sequence "$EXPORT_SEQUENCE"} ${EXPORT_IMAGE:+--image "$EXPORT_IMAGE"}
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $EXPORT_SINCE != null && $EXPORT_SINCE != ""'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $EXPORT_SEQUENCE != null && $EXPORT_SEQUENCE != ""'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $EXPORT_IMAGE != null && $EXPORT_IMAGE != ""'
