---
# Select this file as the CI configuration path in a separate high-side project.
# NiFi uploads each bundle to this project's generic package registry, then starts a pipeline
# through the API with BUNDLE set to the uploaded file name. A schedule catches up on any it missed.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'

variables:
  BUNDLE: ''

stages: [verify, publish]
default:
  tags: [quay-mirror-high]

verify:
  stage: verify
  dependencies: []
  script:
    - python3 -m unittest discover -s tests -v

import:
  stage: publish
  environment:
    name: mirror-high
    action: prepare
  resource_group: quay-mirror-high
  needs:
    - job: verify
      artifacts: false
  variables:
    # The receipt lives in this project's package registry and the downloads in the job directory.
    MIRROR_LEDGER: 'true'
    IMPORT_STATE_DIR: '$CI_PROJECT_DIR/.import-work'
    REGISTRY_AUTH_FILE: $CI_PROJECT_DIR/.registry-auth.json
  script:
    - printf '%s' "$HIGH_QUAY_PASSWORD" | skopeo login --tls-verify="${HIGH_QUAY_TLS_VERIFY:-true}" --username "$HIGH_QUAY_USERNAME" --password-stdin "$HIGH_QUAY_HOST"
    - |
      if [ -n "${IMPORT_INBOX_DIR:-}" ]; then
        python3 mirror.py import --inbox "$IMPORT_INBOX_DIR"
      else
        python3 mirror.py import --registry ${BUNDLE:+--name "$BUNDLE"}
      fi
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.registry-auth.json" "$CI_PROJECT_DIR/.import-work"
