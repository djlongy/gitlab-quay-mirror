---
# Select this file as the CI configuration path in a separate high-side project.
# NiFi uploads each bundle to IMPORT_STORE (this project's package registry, or S3), then starts a pipeline
# through the API with BUNDLE set to the uploaded file name. A schedule catches up on any it missed.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'

variables:
  BUNDLE: ''
  # Runner tag for every job; empty sends them to any runner that takes untagged jobs.
  MIRROR_JOB_TAG: ''
  # true adds the manual promote job: import pushes to the dev registry, promote copies to prod.
  MIRROR_PROMOTE: 'false'

stages: [verify, publish, promote]
default:
  tags: [$MIRROR_JOB_TAG]

verify:
  stage: verify
  dependencies: []
  script:
    - python3 -m unittest discover -s tests -v

import:
  stage: publish
  environment:
    name: dev
    deployment_tier: development
  resource_group: registry-mirror-high
  needs:
    - job: verify
      artifacts: false
  variables:
    # The receipt lives in IMPORT_STORE (package registry or S3) and the downloads in the job directory.
    MIRROR_LEDGER: 'true'
    IMPORT_STATE_DIR: '$CI_PROJECT_DIR/.import-work'
    REGISTRY_AUTH_FILE: $CI_PROJECT_DIR/.registry-auth.json
  script:
    - python3 mirror.py login
    - |
      if [ -n "${IMPORT_INBOX_DIR:-}" ]; then
        python3 mirror.py import --inbox "$IMPORT_INBOX_DIR" --record imported.json
      else
        python3 mirror.py import --registry ${BUNDLE:+--name "$BUNDLE"} --record imported.json
      fi
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.registry-auth.json" "$CI_PROJECT_DIR/.import-work"
  artifacts:
    # What this pipeline pushed to dev, by digest: the list promote copies to prod.
    paths: [imported.json]
    expire_in: 90 days

# Approval gate: only users allowed to merge to the protected default branch can run it.
# Scoped to prod: SOURCE_REGISTRY* reads the dev registry, TARGET_REGISTRY* writes the prod registry.
promote:
  stage: promote
  environment:
    name: prod
    deployment_tier: production
  resource_group: registry-mirror-prod
  needs: [import]
  rules:
    - if: '$MIRROR_PROMOTE == "true"'
      when: manual
      allow_failure: false
  manual_confirmation: 'Copy the images this pipeline imported from the dev registry to the prod registry?'
  variables:
    REGISTRY_AUTH_FILE: '$CI_PROJECT_DIR/.registry-auth.json'
  script:
    - python3 mirror.py login
    - python3 mirror.py promote imported.json
  after_script:
    - rm -f "$CI_PROJECT_DIR/.registry-auth.json"
