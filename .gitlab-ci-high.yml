---
# Select this file as the CI configuration path in a separate high-side project.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'

stages: [verify, publish]
default:
  tags: [quay-mirror-high]

verify:
  stage: verify
  dependencies: []
  script:
    - python3 -m unittest discover -s tests -v

import:
  stage: publish
  environment:
    name: mirror-high
    action: prepare
  resource_group: quay-mirror-high
  needs:
    - job: verify
      artifacts: false
  variables:
    REGISTRY_AUTH_FILE: $CI_PROJECT_DIR/.registry-auth.json
  script:
    - printf '%s' "$HIGH_QUAY_PASSWORD" | skopeo login --username "$HIGH_QUAY_USERNAME" --password-stdin "$HIGH_QUAY_HOST"
    - python3 mirror.py import --inbox "${IMPORT_INBOX_DIR:?Set IMPORT_INBOX_DIR to the transfer inbox}"
  after_script:
    - rm -f "$CI_PROJECT_DIR/.registry-auth.json"
